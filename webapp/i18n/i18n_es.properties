# This is the resource bundle for sapui5.maintenance

#Texts for manifest.json

#XTIT: Application name
appTitle=Avisos de mantenimiento

#YDES: Application description
appDescription=Gestión de avisos de mantenimiento de planta

#Views

#XTIT: Title of the request list page
requestListTitle=Avisos de mantenimiento

#Request list

#XTIT: Title of the request table while the number of requests is unknown
requestTableTitle=Avisos

#XTIT: Title of the request table; {0} is the number of requests that match the filters
requestTableTitleWithCount=Avisos ({0})

#YMSG: Text shown in the request table when no request matches the filters
requestTableNoData=No se han encontrado avisos

#XCOL: Column header: request number and draft mark
columnRequest=Aviso

#XCOL: Column header: title of the request
columnTitle=Título

#XCOL: Column header: name of the plant
columnPlant=Planta

#XCOL: Column header: name of the equipment
columnEquipment=Equipo

#XCOL: Column header: priority of the request
columnPriority=Prioridad

#XCOL: Column header: status of the request
columnStatus=Estado

#XCOL: Column header: date by which the request must be completed
columnRequiredEndDate=Fecha límite

#XFLD: Placeholder of the search field of the request list (request number or title)
searchPlaceholder=Buscar por aviso o título

#XFLD: Placeholder of the status filter of the request list (multiple selection)
filterStatusPlaceholder=Estado

#XFLD: Placeholder of the priority filter of the request list
filterPriorityPlaceholder=Prioridad

#XFLD: Placeholder of the plant filter of the request list
filterPlantPlaceholder=Planta

#XTOL: Tooltip of the button that opens the sort dialog of the request list
sortButtonTooltip=Ordenar

#XTOL: Tooltip of the button that resets the search, the filters and the sort order of the request list
resetButtonTooltip=Restablecer filtros

#XTIT: Title of the sort dialog of the request list
sortDialogTitle=Ordenar

#XSEL: Sort option of the request list: by request number
sortByRequest=Aviso

#XSEL: Sort option of the request list: by due date
sortByRequiredEndDate=Fecha límite

#XSEL: Sort option of the request list: by priority
sortByPriority=Prioridad

#Request detail

#XFLD: Label of the priority of the request in the header title of the detail
headerPriority=Prioridad

#XFLD: Label of the status of the request in the header title of the detail
headerStatus=Estado

#XFLD: Label of the plant name in the header of the detail
headerPlant=Planta

#XFLD: Label of the equipment name in the header of the detail
headerEquipment=Equipo

#XFLD: Label of the functional location of the equipment in the header of the detail
headerFunctionalLocation=Ubicación técnica

#XFLD: Label of the technician assigned to the request in the header of the detail
headerAssignedTo=Técnico asignado

#XFLD: Label of the estimated cost of the spare parts, with its currency, in the header of the detail
headerEstimatedCost=Coste estimado

#XTIT: Title of the section of the detail with the general information of the request
generalSectionTitle=Datos generales

#XFLD: Label of the request type in the general information of the detail
generalRequestType=Tipo

#XFLD: Label of the description of the request in the general information of the detail
generalDescription=Descripción

#XFLD: Label of the user who reported the request in the general information of the detail
generalReportedBy=Notificado por

#XFLD: Label of the date by which the request must be completed, in the general information of the detail
generalRequiredEndDate=Fecha límite

#XFLD: Label of the date and time when the work started, in the general information of the detail
generalStartedAt=Inicio del trabajo

#XFLD: Label of the date and time when the work ended, in the general information of the detail
generalCompletedAt=Fin del trabajo

#XFLD: Label of the hours the equipment was out of service, in the general information of the detail
generalDowntimeHours=Horas de parada

#XFLD: Label of the resolution entered when the request was completed, in the general information of the detail
generalResolution=Resolución

#XFLD: Label of the reason entered when the request was rejected, in the general information of the detail
generalRejectionReason=Motivo del rechazo

#XTIT: Title of the section of the detail with the operations of the request
tasksSectionTitle=Operaciones

#YMSG: Text shown in the operations table of the detail when the request has no operations
taskTableNoData=No hay operaciones

#XCOL: Column header of the operations table: item number of the operation
taskColumnNumber=Posición

#XCOL: Column header of the operations table: description of the operation
taskColumnDescription=Operación

#XCOL: Column header of the operations table: hours planned for the operation
taskColumnPlannedHours=Horas previstas

#XCOL: Column header of the operations table: hours worked on the operation
taskColumnActualHours=Horas reales

#XCOL: Column header of the operations table: whether the operation is completed
taskColumnCompleted=Terminada

#XTIT: Title of the section of the detail with the spare parts of the request
partsSectionTitle=Repuestos

#YMSG: Text shown in the spare parts table of the detail when the request has no spare parts
partTableNoData=No hay repuestos

#XCOL: Column header of the spare parts table: name and number of the material
partColumnProduct=Material

#XCOL: Column header of the spare parts table: quantity with its unit of measure
partColumnQuantity=Cantidad

#XCOL: Column header of the spare parts table: price per unit, with its currency
partColumnUnitPrice=Precio

#XCOL: Column header of the spare parts table: quantity by unit price, with its currency
partColumnAmount=Importe

#XTIT: Title of the section of the detail with the attachments of the request
attachmentsSectionTitle=Adjuntos

#YMSG: Text shown in the attachment list of the detail when the request has no attachments
attachmentListNoData=No hay adjuntos

#Error handling

#XTIT: Title of the message box shown when the service returns a technical error
errorTitle=Error

#YMSG: Text of the message box shown when the service returns a technical error
errorText=El servicio no ha podido procesar la petición. Compruebe la conexión e inténtelo de nuevo. Los detalles contienen el mensaje del servicio.
