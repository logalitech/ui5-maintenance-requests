#YMSG: Text of the dialog that asks for confirmation before the draft is discarded
discardConfirmText=Se perderán todos los cambios de este borrador. ¿Desea descartar el borrador?

#XBUT: Button of the confirmation dialog that discards the draft
discardConfirmAction=Descartar

#XBUT: Button of the detail of an active request that assigns it to a technician
