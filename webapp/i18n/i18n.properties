# This is the resource bundle for sapui5.maintenance

#Texts for manifest.json

#XTIT: Application name
appTitle=Maintenance Requests

#YDES: Application description
appDescription=Plant maintenance request management

#Views

#XTIT: Title of the request list page
requestListTitle=Maintenance Requests

#Request list

#XTIT: Title of the request table while the number of requests is unknown
requestTableTitle=Requests

#XTIT: Title of the request table; {0} is the number of requests that match the filters
requestTableTitleWithCount=Requests ({0})

#YMSG: Text shown in the request table when no request matches the filters
requestTableNoData=No requests found

#XCOL: Column header: request number and draft mark
columnRequest=Request

#XCOL: Column header: title of the request
columnTitle=Title

#XCOL: Column header: name of the plant
columnPlant=Plant

#XCOL: Column header: name of the equipment
columnEquipment=Equipment

#XCOL: Column header: priority of the request
columnPriority=Priority

#XCOL: Column header: status of the request
columnStatus=Status

#XCOL: Column header: date by which the request must be completed
columnRequiredEndDate=Due date

#XFLD: Placeholder of the search field of the request list (request number or title)
searchPlaceholder=Search by request or title

#XBUT: Button of the request list that creates a new request as a draft and opens it in the detail
createButtonText=Create

#XFLD: Placeholder of the status filter of the request list (multiple selection)
filterStatusPlaceholder=Status

#XFLD: Placeholder of the priority filter of the request list
filterPriorityPlaceholder=Priority

#XFLD: Placeholder of the plant filter of the request list
filterPlantPlaceholder=Plant

#XTOL: Tooltip of the button that opens the sort dialog of the request list
sortButtonTooltip=Sort

#XTOL: Tooltip of the button that resets the search, the filters and the sort order of the request list
resetButtonTooltip=Reset filters

#XTIT: Title of the sort dialog of the request list
sortDialogTitle=Sort

#XSEL: Sort option of the request list: by request number
sortByRequest=Request

#XSEL: Sort option of the request list: by due date
sortByRequiredEndDate=Due date

#XSEL: Sort option of the request list: by priority
sortByPriority=Priority

#Request detail

#XTOL: Tooltip of the button that shows the detail in full screen
detailEnterFullScreenTooltip=Enter full screen

#XTOL: Tooltip of the button that shows the detail next to the request list again
detailExitFullScreenTooltip=Exit full screen

#XTOL: Tooltip of the button that closes the detail and shows the request list alone
detailCloseTooltip=Close

#XBUT: Button of the detail of an active request that switches to edit mode on its draft
detailEditButton=Edit

#XBUT: Button in the footer of the detail in edit mode that activates the draft (the request is saved)
detailSaveButton=Save

#XMSG: Notification after the draft has been activated; {0} is the request number
saveSuccessMessage=Request {0} saved

#XBUT: Button in the footer of the detail in edit mode that discards the draft
detailDiscardButton=Discard

#XMSG: Saving state of the draft in the footer of the detail, while a change is being sent to the service
draftSavingText=Saving draft...

#XMSG: Saving state of the draft in the footer of the detail, once the service has saved the last change
draftSavedText=Draft saved

#XTOL: Tooltip of the button in the footer of the detail that shows the number of messages and opens their detail
messagesButtonTooltip=Messages

#XTIT: Title of the dialog that asks for confirmation before the draft is discarded
discardConfirmTitle=Discard Draft

#YMSG: Text of the dialog that asks for confirmation before the draft is discarded
discardConfirmText=All changes of this draft will be lost. Do you want to discard the draft?

#XBUT: Button of the confirmation dialog that discards the draft
discardConfirmAction=Discard

#XFLD: Label of the priority of the request in the header title of the detail
headerPriority=Priority

#XFLD: Label of the status of the request in the header title of the detail
headerStatus=Status

#XFLD: Label of the plant name in the header of the detail
headerPlant=Plant

#XFLD: Label of the equipment name in the header of the detail
headerEquipment=Equipment

#XFLD: Label of the functional location of the equipment in the header of the detail
headerFunctionalLocation=Functional location

#XFLD: Label of the technician assigned to the request in the header of the detail
headerAssignedTo=Assigned technician

#XFLD: Label of the estimated cost of the spare parts, with its currency, in the header of the detail
headerEstimatedCost=Estimated cost

#XTIT: Title of the section of the detail with the general information of the request
generalSectionTitle=General information

#XFLD: Label of the title of the request in the general information of the detail (edit mode)
generalTitle=Title

#XFLD: Label of the request type in the general information of the detail
generalRequestType=Type

#XFLD: Label of the priority of the request in the general information of the detail (edit mode)
generalPriority=Priority

#XFLD: Label of the plant of the request in the general information of the detail (edit mode)
generalPlant=Plant

#XFLD: Label of the equipment of the request in the general information of the detail (edit mode)
generalEquipment=Equipment

#XFLD: Label of the description of the request in the general information of the detail
generalDescription=Description

#XFLD: Label of the user who reported the request in the general information of the detail
generalReportedBy=Reported by

#XFLD: Label of the date by which the request must be completed, in the general information of the detail
generalRequiredEndDate=Due date

#XFLD: Label of the date and time when the work started, in the general information of the detail
generalStartedAt=Work start

#XFLD: Label of the date and time when the work ended, in the general information of the detail
generalCompletedAt=Work end

#XFLD: Label of the hours the equipment was out of service, in the general information of the detail
generalDowntimeHours=Downtime hours

#XFLD: Label of the resolution entered when the request was completed, in the general information of the detail
generalResolution=Resolution

#XFLD: Label of the reason entered when the request was rejected, in the general information of the detail
generalRejectionReason=Rejection reason

#XTIT: Title of the section of the detail with the operations of the request
tasksSectionTitle=Operations

#YMSG: Text shown in the operations table of the detail when the request has no operations
taskTableNoData=No operations

#XCOL: Column header of the operations table: item number of the operation
taskColumnNumber=Item

#XCOL: Column header of the operations table: description of the operation
taskColumnDescription=Operation

#XCOL: Column header of the operations table: hours planned for the operation
taskColumnPlannedHours=Planned hours

#XCOL: Column header of the operations table: hours worked on the operation
taskColumnActualHours=Actual hours

#XCOL: Column header of the operations table: whether the operation is completed
taskColumnCompleted=Completed

#XTIT: Title of the section of the detail with the spare parts of the request
partsSectionTitle=Spare parts

#YMSG: Text shown in the spare parts table of the detail when the request has no spare parts
partTableNoData=No spare parts

#XCOL: Column header of the spare parts table: name and number of the material
partColumnProduct=Material

#XCOL: Column header of the spare parts table: quantity with its unit of measure
partColumnQuantity=Quantity

#XCOL: Column header of the spare parts table: price per unit, with its currency
partColumnUnitPrice=Unit price

#XCOL: Column header of the spare parts table: quantity by unit price, with its currency
partColumnAmount=Amount

#XTIT: Title of the section of the detail with the attachments of the request
attachmentsSectionTitle=Attachments

#YMSG: Text shown in the attachment list of the detail when the request has no attachments
attachmentListNoData=No attachments

#Request not found

#XTIT: Title of the page shown instead of the detail when the request of the URL does not exist
notFoundPageTitle=Request

#XTIT: Title of the message shown when the request of the URL does not exist
notFoundTitle=Request not found

#YMSG: Description of the message shown when the request of the URL does not exist
notFoundDescription=The request does not exist or is no longer available. Check the address or select a request in the list.

#XLNK: Link from the page of a request that does not exist to the request list
notFoundListLink=Show request list

#Error handling

#XTIT: Title of the message box shown when the service returns a technical error
errorTitle=Error

#YMSG: Text of the message box shown when the service returns a technical error
errorText=The service could not process the request. Check the connection and try again. The details contain the message of the service.
